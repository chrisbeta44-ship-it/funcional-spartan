<!doctype html><html lang="pt-BR"><head><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Funcional Spartan"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="/assets/file_00000000e6ec820ebe3595590444cd78.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Cadastro | Funcional Spartan</title><link rel="stylesheet" href="../styles.css"><style>.form-shell{max-width:650px;margin:50px auto}.form-shell .card{padding:26px}.form-shell label{display:block;color:#ddd;font-size:13px;font-weight:700;margin:14px 0 7px}.form-shell input,.form-shell select{display:block;width:100%;padding:14px;background:#090909;border:1px solid #444;border-radius:5px;color:#fff;font:inherit}.form-shell .check{display:flex;gap:10px;align-items:flex-start;font-weight:500;line-height:1.5}.form-shell .check input{width:auto;margin-top:3px}.note{padding:14px;background:#1c140e;border:1px solid #613716;border-radius:6px;color:#eee;line-height:1.6;margin-top:16px}.hidden{display:none}</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="../"><img class="brand-image" src="../assets/file_00000000e6ec820ebe3595590444cd78.png" alt="Funcional Spartan"><span>FUNCIONAL <b>SPARTAN</b></span></a><a href="../">Voltar ao site</a></div></header>
<main class="wrap form-shell"><div class="eyebrow">Faça parte da equipe</div><h1 style="font:800 48px 'Barlow Condensed';margin:8px 0 20px">CADASTRO DE ALUNO</h1><section class="card"><p style="color:#aaa;line-height:1.6">Preencha seus dados para criar seu acesso à Área do Aluno. Após o envio, confirme sua inscrição pelo WhatsApp.</p>
<form id="signupForm">
<label for="fullName">Nome completo</label><input id="fullName" required autocomplete="name" maxlength="100">
<label for="cpf">CPF</label><input id="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off"><label for="birthDate">Data de nascimento</label><input id="birthDate" required type="date" autocomplete="bday"><p id="agePreview" style="margin: -8px 0 12px;color:#ff9a4a;font-weight:800" aria-live="polite">Sua idade aparecerá aqui após informar a data de nascimento.</p><label for="phone">WhatsApp</label><input id="phone" required type="tel" autocomplete="tel" placeholder="(31) 99999-9999">
<label for="email">E-mail</label><input id="email" required type="email" autocomplete="email">

<label for="password">Crie uma senha (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8" required autocomplete="new-password">
<label class="check"><input id="optin" type="checkbox" required><span>Autorizo receber mensagens da Funcional Spartan pelo WhatsApp sobre cadastro, pagamentos e vencimentos.</span></label>
<button class="btn" id="submitBtn" type="submit">Criar meu cadastro</button>
</form><div id="result" class="note hidden" role="status"></div><a id="whatsBtn" class="btn hidden" target="_blank" rel="noopener" style="margin-top:14px">Confirmar pelo WhatsApp</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://jdbpfrmjbwhtxrtcxjur.supabase.co','sb_publishable_49p9HbBO99ZQPh28tN3d0g_pmXPIWH0');
const form=document.getElementById('signupForm'),result=document.getElementById('result'),btn=document.getElementById('submitBtn'),wa=document.getElementById('whatsBtn'),birthInput=document.getElementById('birthDate'),agePreview=document.getElementById('agePreview');
function calculateAge(value){if(!value)return null;const birth=new Date(value+'T12:00:00'),today=new Date();if(Number.isNaN(birth.getTime())||birth>today)return null;let age=today.getFullYear()-birth.getFullYear();if(today.getMonth()<birth.getMonth()||(today.getMonth()===birth.getMonth()&&today.getDate()<birth.getDate()))age--;return age;}
birthInput.max=new Date().toISOString().slice(0,10);birthInput.addEventListener('input',()=>{const age=calculateAge(birthInput.value);agePreview.textContent=age===null?(birthInput.value?'Confira a data de nascimento.':'Sua idade aparecerá aqui após informar a data de nascimento.'):'Idade calculada automaticamente: '+age+' anos.';});
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Enviando cadastro...';result.classList.add('hidden');wa.classList.add('hidden');
const cpf=document.getElementById('cpf').value.replace(/\D/g,''),birth_date=document.getElementById('birthDate').value,full_name=document.getElementById('fullName').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,enrollment_type='external';
if(!birth_date||calculateAge(birth_date)===null){result.textContent='Informe uma data de nascimento válida, que não esteja no futuro.';result.classList.remove('hidden');btn.disabled=false;btn.textContent='Criar meu cadastro';return;}if(cpf.length!==11){result.textContent='Informe um CPF com 11 números.';result.classList.remove('hidden');btn.disabled=false;btn.textContent='Criar meu cadastro';return;}
const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/aluno/?confirmado=1',data:{full_name,phone,birth_date,enrollment_type,cpf,whatsapp_opt_in:true}}});
if(error){const duplicate=/cpf.*já possui cadastro|duplicate key|student_identity.*cpf_hmac/i.test(error.message||'');result.textContent=duplicate?'Este CPF já possui cadastro. Acesse a Área do Aluno com seu e-mail e senha ou fale com a equipe para recuperar seu acesso.':'Não foi possível concluir: '+error.message;result.classList.remove('hidden');btn.disabled=false;btn.textContent='Tentar novamente';return;}
result.textContent='Cadastro recebido! O CPF informado neste formulário será conferido automaticamente com a lista oficial para definir sua condição e seu plano. Você não precisará digitar o CPF novamente na Área do Aluno. Se o e-mail precisar de confirmação, confirme a mensagem enviada e depois entre na Área do Aluno.';
result.classList.remove('hidden');
const message='Olá! Acabei de preencher meu cadastro na Funcional Spartan.\nNome: '+full_name+'\nWhatsApp: '+phone+'\nE-mail: '+email+'\nPlano: '+(enrollment_type==='school_staff'?'Funcionário':'Público geral')+'. Gostaria de confirmar minha inscrição.';
wa.href='https://wa.me/5531987374386?text='+encodeURIComponent(message);wa.classList.remove('hidden');btn.textContent='Cadastro enviado';btn.disabled=true;
});
</script><script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(error => {
      console.warn('Não foi possível ativar o modo instalável:', error);
    });
  });
}
</script><script src="/back-button.js"></script></body></html>
